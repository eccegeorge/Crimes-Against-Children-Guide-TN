<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TN CAC Guide" />
  <title>TN CAC Statutory Reference Guide</title>
  <link id="pwa-manifest" rel="manifest" />
  <link id="apple-icon" rel="apple-touch-icon" />
  <style>
    :root {
      --navy: #0F172A;
      --slate-dark: #1E293B;
      --slate-muted: #475569;
      --slate-subtle: #64748B;
      --bg-app: #F1F5F9;
      --bg-surface: #FFFFFF;
      --bg-class: #F4F6F9;
      --border-card: #CBD5E1;
      --border-inner: #E2E8F0;
      --royal-blue: #1D4ED8;
      --royal-blue-bg: #EFF6FF;
      --royal-blue-border: #BFDBFE;
      --tap-bar-bg: #DCE8FA;
      --tap-bar-hover: #CFE0F8;
      --color-probation: #166534;
      --color-release: #B91C1C;
      --color-sor: #4338CA;
      --color-csl: #C2410C;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--slate-dark);
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Top Chrome */
    .app-chrome {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .app-header {
      background-color: var(--navy);
      color: #FFFFFF;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .app-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .offline-pill {
      font-size: 11px;
      font-weight: 600;
      color: #93C5FD;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(147, 197, 253, 0.28);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .expand-all-btn {
      font-size: 11.5px;
      font-weight: 600;
      color: #F8FAFC;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 7px;
      padding: 4px 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .expand-all-btn:active {
      background: rgba(255, 255, 255, 0.24);
    }

    /* 4-Tab Bar */
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-inner);
    }

    .tab-btn {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 11px 4px 9px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--slate-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn.active {
      color: var(--royal-blue);
      border-bottom-color: var(--royal-blue);
    }

    .tab-count {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      background: #F1F5F9;
      color: var(--slate-muted);
    }

    .tab-btn.active .tab-count {
      background: var(--royal-blue-bg);
      color: var(--royal-blue);
    }

    /* Search Bar */
    .search-bar-wrap {
      padding: 10px 14px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-inner);
    }

    .search-input-box {
      position: relative;
      display: flex;
      align-items: center;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 0 10px;
    }

    .search-input-box:focus-within {
      background: #FFFFFF;
      border-color: var(--royal-blue);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .search-icon {
      color: var(--slate-subtle);
      font-size: 15px;
      margin-right: 8px;
      user-select: none;
    }

    .search-input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 9px 0;
      font-size: 14.5px;
      color: var(--navy);
      outline: none;
    }

    .search-input::placeholder {
      color: #64748B;
    }

    .clear-search-btn {
      appearance: none;
      border: none;
      background: #CBD5E1;
      color: #1E293B;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 6px;
    }

    .clear-search-btn.visible {
      display: flex;
    }

    .search-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 7px;
      font-size: 12px;
      color: var(--slate-muted);
    }

    .scope-toggle {
      display: inline-flex;
      background: #F1F5F9;
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }

    .scope-btn {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--slate-muted);
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .scope-btn.active {
      background: #FFFFFF;
      color: var(--royal-blue);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    /* Main Container */
    .main-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px calc(32px + env(safe-area-inset-bottom));
    }

    /* Offense Card Design */
    .offense-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .offense-card.expanded {
      border-color: #93C5FD;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.09);
    }

    .card-face {
      padding: 14px 14px 12px;
      cursor: pointer;
    }

    .card-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .offense-title {
      margin: 0;
      font-size: 17.5px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.25;
    }

    .cat-badge {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 6px;
      background: #F1F5F9;
      color: var(--slate-muted);
      border: 1px solid #E2E8F0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Option 1 Royal Blue Statute Pill */
    .tca-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--royal-blue);
      background-color: var(--royal-blue-bg);
      border: 1px solid var(--royal-blue-border);
      border-radius: 7px;
      letter-spacing: 0.01em;
    }

    /* Classification Box (No Section Title) */
    .class-box {
      margin-top: 11px;
      background-color: var(--bg-class);
      border: 1px solid var(--border-inner);
      border-radius: 9px;
      padding: 9px 11px;
    }

    /* Bullet Lines with Hanging Indents */
    .line-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bullet-line {
      font-size: 13.5px;
      line-height: 1.38;
      padding-left: 1.05em;
      text-indent: -1.05em;
      word-break: break-word;
    }

    .bullet-line.lvl-1 {
      padding-left: 2.05em;
      text-indent: -1.0em;
    }

    .bullet-line.lvl-2 {
      padding-left: 3.05em;
      text-indent: -1.0em;
    }

    .class-box .bullet-line {
      color: var(--slate-dark);
      font-weight: 500;
    }

    /* 2-Column Color-Coded Sentencing & Registry Grid (No Section Titles) */
    .quadrant-split {
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--border-inner);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .split-col-left {
      padding-right: 10px;
      border-right: 1px solid var(--border-inner);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .split-col-right {
      padding-left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .q-probation .bullet-line {
      color: var(--color-probation);
      font-weight: 700;
      font-size: 13.2px;
    }

    .q-release .bullet-line {
      color: var(--color-release);
      font-weight: 700;
      font-size: 13.2px;
    }

    .q-sor .bullet-line {
      color: var(--color-sor);
      font-weight: 700;
      font-size: 13.2px;
    }

    .q-csl .bullet-line {
      color: var(--color-csl);
      font-weight: 700;
      font-size: 13.2px;
    }

    /* Collapsible Accordion Drawer */
    .accordion-drawer {
      display: none;
      border-top: 1px solid var(--border-inner);
      background: #FFFFFF;
    }

    .offense-card.expanded .accordion-drawer {
      display: block;
    }

    .drawer-section {
      padding: 12px 14px;
    }

    .drawer-section + .drawer-section {
      border-top: 1px solid var(--border-inner);
      background: #FAFCFF;
    }

    .drawer-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--royal-blue);
      margin: 0 0 8px 0;
    }

    .drawer-section .bullet-line {
      color: var(--navy);
      font-size: 13.8px;
      line-height: 1.44;
    }

    .note-subheading {
      font-size: 13.8px;
      font-weight: 700;
      color: var(--navy);
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .note-subheading:first-child {
      margin-top: 0;
    }

    .note-spacer {
      height: 5px;
    }

    /* Bottom Tap Drawer Bar */
    .tap-bar {
      width: 100%;
      appearance: none;
      border: none;
      border-top: 1px solid #C7D9F5;
      background-color: var(--tap-bar-bg);
      color: var(--royal-blue);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.12s ease;
    }

    .tap-bar:hover {
      background-color: var(--tap-bar-hover);
    }

    /* Quick Reference Guides View */
    .guide-filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .guide-pill {
      appearance: none;
      border: 1px solid var(--border-card);
      background: #FFFFFF;
      color: var(--slate-dark);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .guide-pill.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .guide-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
    }

    .guide-card-header {
      background: var(--navy);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 3px solid var(--royal-blue);
    }

    .guide-card-title {
      margin: 0;
      font-size: 16.5px;
      font-weight: 700;
    }

    .guide-section {
      border-top: 1px solid var(--border-inner);
    }

    .guide-section:first-of-type {
      border-top: none;
    }

    .guide-sec-hdr {
      background: #F1F5F9;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-inner);
      font-size: 13.8px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .guide-sec-body {
      padding: 10px 14px 12px;
    }

    .guide-subhdr {
      background: #F8FAFC;
      border-top: 1px solid var(--border-inner);
      border-bottom: 1px solid var(--border-inner);
      padding: 6px 10px;
      margin: 10px -14px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .guide-subhdr:first-child {
      margin-top: -10px;
      border-top: none;
    }

    .guide-item {
      font-size: 13.5px;
      line-height: 1.42;
      color: var(--slate-dark);
      padding-left: 1.05em;
      text-indent: -1.05em;
      margin-bottom: 5px;
    }

    .guide-item:last-child {
      margin-bottom: 0;
    }

    .guide-bullet {
      color: var(--royal-blue);
      font-weight: 800;
    }

    .guide-qualifier {
      font-size: 12.8px;
      font-style: italic;
      color: var(--slate-muted);
      padding-left: 1.85em;
      text-indent: -0.75em;
      margin-top: -2px;
      margin-bottom: 6px;
    }

    .statute-inline-badge {
      display: inline-block;
      padding: 1px 6px;
      font-size: 12.2px;
      font-weight: 700;
      color: var(--royal-blue);
      background: var(--royal-blue-bg);
      border: 1px solid var(--royal-blue-border);
      border-radius: 5px;
      text-indent: 0;
    }

    .paren-muted {
      font-style: italic;
      color: var(--slate-muted);
      font-size: 12.8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #FFFFFF;
      border: 1px dashed var(--border-card);
      border-radius: 14px;
      color: var(--slate-muted);
    }

    .empty-state h3 {
      margin: 0 0 6px;
      color: var(--navy);
      font-size: 16px;
    }

    .empty-state p {
      margin: 0;
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <header class="app-chrome">
    <div class="app-header">
      <div class="app-title-wrap">
        <h1 class="app-title">TN CAC Statutory Reference Guide</h1>
      </div>
      <div class="header-actions">
        <span class="offline-pill" id="offline-status">Offline Ready</span>
        <button type="button" class="expand-all-btn" id="expand-all-btn">Expand All</button>
      </div>
    </div>

    <nav class="tab-bar" role="tablist">
      <button type="button" class="tab-btn active" data-tab="Physical" role="tab">
        PHYSICAL <span class="tab-count" id="count-Physical">21</span>
      </button>
      <button type="button" class="tab-btn" data-tab="Sexual" role="tab">
        SEXUAL <span class="tab-count" id="count-Sexual">30</span>
      </button>
      <button type="button" class="tab-btn" data-tab="CSAM" role="tab">
        CSAM <span class="tab-count" id="count-CSAM">3</span>
      </button>
      <button type="button" class="tab-btn" data-tab="Guides" role="tab">
        GUIDES <span class="tab-count">3</span>
      </button>
    </nav>

    <div class="search-bar-wrap">
      <div class="search-input-box">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search offense, T.C.A. §, class, elements, or guides..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
        <button type="button" id="clear-search-btn" class="clear-search-btn" aria-label="Clear search">&times;</button>
      </div>
      <div class="search-meta-bar" id="search-meta-bar" style="display: none;">
        <span id="search-result-label">Showing matches</span>
        <div class="scope-toggle">
          <button type="button" class="scope-btn active" data-scope="all">All Categories</button>
          <button type="button" class="scope-btn" data-scope="tab">Current Tab Only</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container" id="main-container"></main>

d on the intimate area of the individual", "level": 0}, {"text": "• Photograph would be considered offensive or embarrassing by the individual", "level": 0}, {"text": "• Photograph was taken for the purpose of sexual arousal or gratification of the defendant", "level": 0}], "notes": [{"text": "Special Definitions:", "level": 0}, {"text": "• \"Intimate area\" means the naked or clothed genitals, pubic area, anus, buttocks, or female breast of a person.", "level": 0}, {"text": "• \"Photograph\" means any photograph or photographic reproduction, whether taken using digital media or conventional film, still or moving, or any videotape, live television transmission, or social media broadcast of any individual.", "level": 0}, {"text": "Special Notes:", "level": 0}, {"text": "• Unlike subdivisions (a)(1) and (a)(2), this offense does not require that the individual have a reasonable expectation of privacy.", "level": 0}, {"text": "• All photographs taken in violation of this section shall be confiscated and, after use as evidence, disposed of according to law.", "level": 0}, {"text": "• The State may elect to prosecute conduct under any other applicable statute, including Title 39, Chapter 17, Parts 9 and 10.", "level": 0}, {"text": "• The statute of limitations is tolled during any period the defendant conceals the crime until the victim discovers the crime.", "level": 0}]}, {"id": 45, "name": "Continuous Sexual Abuse of a Child", "tca": "39-13-518", "category": "Sexual", "classLines": [{"text": "• A Felony if three (3) or more acts constitute:", "level": 0}, {"text": "○ Aggravated Rape", "level": 1}, {"text": "○ Rape", "level": 1}, {"text": "○ Aggravated Sexual Battery", "level": 1}, {"text": "○ Rape of a Child", "level": 1}, {"text": "○ Soliciting Sexual Exploitation of a Minor", "level": 1}, {"text": "○ Aggravated Rape of a Child", "level": 1}, {"text": "○ Trafficking for a Commercial Sex Act involving a minor", "level": 1}, {"text": "○ Promoting Prostitution involving y blood or marriage", "level": 1}, {"text": "○ Victims reside with the defendant", "level": 1}, {"text": "○ Defendant was an authority figure to the victims and the victims knew each other", "level": 1}, {"text": "• \"Sexual abuse of a child\" means:", "level": 0}, {"text": "○ Aggravated Rape", "level": 1}, {"text": "○ Rape", "level": 1}, {"text": "○ Aggravated Sexual Battery", "level": 1}, {"text": "○ Rape of a Child", "level": 1}, {"text": "○ Sexual Battery by an Authority Figure", "level": 1}, {"text": "○ Soliciting Sexual Exploitation of a Minor", "level": 1}, {"text": "○ Aggravated Rape of a Child", "level": 1}, {"text": "○ Statutory Rape by an Authority Figure", "level": 1}, {"text": "○ Trafficking for a Commercial Sex Act involving a minor", "level": 1}, {"text": "○ Promoting Prostitution involving a minor", "level": 1}, {"text": "• At least thirty (30) days prior to trial, the state shall file with the court a written notice identifying the multiple acts of sexual abuse of a child upon which the violation of this section is based. The notice shall include the identity of the victim and the statutory offense violated. Upon good cause, and where the defendant was unaware of the predicate offenses listed in the notice, the trial court may grant a continuance to facilitate proper notification of the incidents of sexual abuse of a child and for preparation by the defense of such incidents specified in the statement.", "level": 0}, {"text": "• The state may charge alternative violations of this section and of the separate offenses committed within the same time period. The separate incidents shall be alleged in separate counts and joined in the same action. A person may be convicted either of one (1) criminal violation of this section, or for one (1) or more of the separate incidents of sexual abuse of a child committed within the county in which the charges were filed, but not both. The state shall not be required to elect submission to the jury of the several counts. The jury shall be instructed to return a verdict on all counts in the indictment. In the event that a verdict of guilty is returned on a separate count that was included in the notice of separate incidents of sexual abuse of a child and the jury returns a verdict of guilty for a violation of this section, at the sentencing hearing the trial judge shall merge the separate count into the conviction under this section and only impose a sentence under this section. A conviction for a violation of this section bars the prosecution of the individual incidents of sexual abuse of a child as separate offenses described in the pretrial notice filed by the state and presented to the jury. A prosecution for a violation of this section does not bar a prosecution in the same action for individual incidents of sexual abuse not identified in the state's pretrial notice. The state shall be required to elect as to those individual incidents of sexual abuse not contained in the pretrial notice prior to submission to the jury. A conviction for such elected offenses shall not be subject to merger at sentencing.", "level": 0}]}, {"id": 46, "name": "Incest", "tca": "39-15-302", "category": "Sexual", "classLines": [{"text": "• C Felony", "level": 0}, {"text": "• B Felony if victim is a minor", "level": 0}, {"text": "• If victim is a minor:", "level": 0}, {"text": "○ Mandatory Range II sentencing minimum", "level": 1}, {"text": "○ Range II offender (may be sentenced within Range III if appropriate)", "level": 1}], "probation": [{"text": "• Probation Eligible - Yes (unless victim is minor)", "level": 0}], "release": [{"text": "• Release Eligibility - 100% (attempt included)", "level": 0}], "sor": [{"text": "• Sex Offender Registry: Yes (Violent Sexual Offender)", "level": 0}], "csl": [{"text": "• Community Supervision for Life: No", "level": 0}], "elements": [{"text": "• Engages in sexual penetration", "level": 0}, {"text": "• Knows the other person is:", "level": 0}, {"text": "○ Natur     const STATUTE_REGEX = /((?:§\s*)?\d{2}-\d{2}-\d{3,4}(?:\([a-zA-Z0-9]+\))*(?:\s*(?:-|–|and)\s*(?:\([a-zA-Z0-9]+\)|[a-zA-Z0-9]+))*)/g;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatGuideLineHtml(rawText) {
      const parts = rawText.split(STATUTE_REGEX);
      return parts.map((part, i) => {
        if (!part) return '';
        if (i % 2 === 1) {
          return `<span class="statute-inline-badge">${escapeHtml(part)}</span>`;
        }
        const parenMatch = part.match(/(\s*\([^)]+\)\s*)$/);
        if (parenMatch && parenMatch[1].trim().length > 6) {
          const prefix = part.slice(0, parenMatch.index);
          const suffix = parenMatch[1];
          return `${escapeHtml(prefix)}<span class="paren-muted">${escapeHtml(suffix)}</span>`;
        }
        return escapeHtml(part);
      }).join('');
    }

    function renderBulletLines(lines) {
      return `<div class="line-list">${lines.map(item => {
        const lvlClass = item.level === 1 ? ' lvl-1' : (item.level === 2 ? ' lvl-2' : '');
        return `<div class="bullet-line${lvlClass}">${escapeHtml(item.text)}</div>`;
      }).join('')}</div>`;
    }

    function renderNotesLines(lines) {
      return lines.map(item => {
        const t = item.text;
        if (t === 'Special Definitions:' || t === 'Special Notes:') {
          return `<div class="note-subheading">${escapeHtml(t)}</div>`;
        }
        const lvlClass = item.level === 1 ? ' lvl-1' : (item.level === 2 ? ' lvl-2' : '');
        const extraTop = (item.level === 0 && t.startsWith('•')) ? ' style="margin-top:5px;"' : '';
        return `<div class="bullet-line${lvlClass}"${extraTop}>${escapeHtml(t)}</div>`;
      }).join('');
    }

    function matchesQuery(offense, q) {
      if (!q) return true;
      const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
      const haystack = [
        offense.name,
        offense.tca,
        't.c.a. § ' + offense.tca,
        offense.category,
        ...offense.classLines.map(x => x.text),
        ...offense.probation.map(x => x.text),
        ...offense.release.map(x => x.text),
        ...offense.sor.map(x => x.text),
        ...offense.csl.map(x => x.text),
        ...offense.elements.map(x => x.text),
        ...offense.notes.map(x => x.text)
      ].join(' ').toLowerCase();
      return tokens.every(tok => haystack.includes(tok));
    }

    function guideMatchesQuery(guide, q) {
      if (!q) return true;
      const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
      const chunks = [guide.title];
      guide.sections.forEach(s => {
        chunks.push(s.header);
        if (s.statute) chunks.push(s.statute);
        s.subgroups.forEach(sg => {
          if (sg.subheader) chunks.push(sg.subheader);
          sg.items.forEach(it => chunks.push(it.text));
        });
      });
      const haystack = chunks.join(' ').toLowerCase();
      return tokens.every(tok => haystack.includes(tok));
    }

    function renderOffenseCard(o, showCategoryBadge) {
      const isExpanded = state.expandedIds.has(o.id);
      const hasNotes = o.notes && o.notes.length > 0;
      const tapText = isExpanded
        ? (hasNotes ? '▲ Tap to Collapse Elements & Notes' : '▲ Tap to Collapse Elements')
        : (hasNotes ? '▼ Tap to View Elements & Notes' : '▼ Tap to View Elements');

      return `
        <article class="offense-card${isExpanded ? ' expanded' : ''}" data-id="${o.id}">
          <div class="card-face" onclick="toggleCard(${o.id}, event)">
            <div class="card-header-row">
              <h2 class="offense-title">${escapeHtml(o.name)}</h2>
              ${showCategoryBadge ? `<span class="cat-badge">${escapeHtml(o.category)}</span>` : ''}
            </div>
            <div class="tca-badge">T.C.A. &sect; ${escapeHtml(o.tca)}</div>

            <div class="class-box">
              ${renderBulletLines(o.classLines)}
            </div>

            <div class="quadrant-split">
              <div class="split-col-left">
                <div class="q-probation">${renderBulletLines(o.probation)}</div>
                <div class="q-release">${renderBulletLines(o.release)}</div>
              </div>
              <div class="split-col-right">
                <div class="q-sor">${renderBulletLines(o.sor)}</div>
                <div class="q-csl">${renderBulletLines(o.csl)}</div>
              </div>
            </div>
          </div>

          <div class="accordion-drawer">
            <div class="drawer-section">
              <div class="drawer-label">Essential Elements</div>
              ${renderBulletLines(o.elements)}
            </div>
            ${hasNotes ? `
              <div class="drawer-section">
                <div class="drawer-label">Special Definitions &amp; Notes</div>
                ${renderNotesLines(o.notes)}
              </div>
            ` : ''}
          </div>

          <button type="button" class="tap-bar" onclick="toggleCard(${o.id}, event)" aria-expanded="${isExpanded}">
            ${tapText}
          </button>
        </article>
      `;

    function renderGuidesView(filteredGuides) {
      const filterPills = state.searchQuery ? '' : `
        <div class="guide-filter-row">
          <button type="button" class="guide-pill${state.activeGuideFilter === 'all' ? ' active' : ''}" onclick="setGuideFilter('all')">All Guides (3)</button>
          <button type="button" class="guide-pill${state.activeGuideFilter === 'probation' ? ' active' : ''}" onclick="setGuideFilter('probation')">Probation Eligibility</button>
          <button type="button" class="guide-pill${state.activeGuideFilter === 'release' ? ' active' : ''}" onclick="setGuideFilter('release')">Release Eligibility</button>
          <button type="button" class="guide-pill${state.activeGuideFilter === 'sor_csl' ? ' active' : ''}" onclick="setGuideFilter('sor_csl')">SOR &amp; CSL</button>
        </div>
      `;

      const visibleGuides = filteredGuides.filter(g =>
        state.searchQuery || state.activeGuideFilter === 'all' || state.activeGuideFilter === g.id
      );

      if (visibleGuides.length === 0) {
        return filterPills + `
          <div class="empty-state">
            <h3>No matching quick reference guides</h3>
            <p>Try clearing your search or switching to All Categories.</p>
          </div>
        `;
      }

      const cardsHtml = visibleGuides.map(g => {
        const sectionsHtml = g.sections.map(sec => {
          const statBadge = sec.statute
            ? `<span class="statute-inline-badge">${escapeHtml(sec.statute)}</span>`
            : '';
          const hasSubgroups = sec.subgroups && sec.subgroups.length > 0;
          const bodyHtml = hasSubgroups ? `
            <div class="guide-sec-body">
              ${sec.subgroups.map(sg => `
                ${sg.subheader ? `<div class="guide-subhdr">${escapeHtml(sg.subheader)}</div>` : ''}
                ${sg.items.map(it => {
                  if (it.qualifier) {
                    return `<div class="guide-qualifier">${escapeHtml(it.text)}</div>`;
                  }
                  return `<div class="guide-item"><span class="guide-bullet">&bull;</span> ${formatGuideLineHtml(it.text)}</div>`;
                }).join('')}
              `).join('')}
            </div>
          ` : '';

          return `
            <div class="guide-section">
              <div class="guide-sec-hdr">
                <span>${escapeHtml(sec.header)}</span>
                ${statBadge}
              </div>
              ${bodyHtml}
            </div>
          `;
        }).join('');

        return `
          <section class="guide-card">
            <div class="guide-card-header">
              <h2 class="guide-card-title">${escapeHtml(g.title)}</h2>
            </div>
            ${sectionsHtml}
          </section>
        `;
      }).join('');

      return filterPills + cardsHtml;
    }

      // Update active tab styling
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
      });

      // Update scope toggle styling
      document.querySelectorAll('.scope-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scope === state.searchScope);

      if (q) {
        metaBar.style.display = 'flex';
        const baseOffenses = state.searchScope === 'tab' && state.activeTab !== 'Guides'
          ? OFFENSES.filter(o => o.category === state.activeTab)
          : OFFENSES;
        const matchedOffenses = (state.searchScope === 'tab' && state.activeTab === 'Guides')
          ? []
          : baseOffenses.filter(o => matchesQuery(o, q));

        const matchedGuides = (state.searchScope === 'all' || state.activeTab === 'Guides')
          ? GUIDES.filter(g => guideMatchesQuery(g, q))
          : [];

        const totalHits = matchedOffenses.length + matchedGuides.length;
        resultLabel.textContent = `${totalHits} match${totalHits === 1 ? '' : 'es'} found`;
        expandAllBtn.style.display = matchedOffenses.length > 0 ? 'inline-block' : 'none';

      if (!visibleOffenses || visibleOffenses.length === 0) return;
      const allExpanded = visibleOffenses.every(o => state.expandedIds.has(o.id));
      btn.textContent = allExpanded ? 'Collapse All' : 'Expand All';
    }

    window.toggleCard = function(id, event) {
      // Avoid toggling if the user is dragging to select/copy text
      const selection = window.getSelection();
      if (selection && selection.toString().length > 0) {
        return;
      }
      if (state.expandedIds.has(id)) {
        state.expandedIds.delete(id);
      } else {
        state.expandedIds.add(id);
      }
      render();
    };

    window.setGuideFilter = function(filterId) {
      state.activeGuideFilter = filterId;
      render();
    };

    // Tab listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // Search listeners
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search-btn');

    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      clearBtn.classList.toggle('visible', state.searchQuery.length > 0);
      render();
    });

    clearBtn.addEventListener('click', () => {
      state.searchQuery = '';
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      searchInput.focus();
      render();
    });

    document.querySelectorAll('.scope-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.searchScope = btn.dataset.scope;
        render();
      });
    });

    // Expand / Collapse All visible offenses
    document.getElementById('expand-all-btn').addEventListener('click', () => {
      const q = state.searchQuery.trim();
      let visibleOffenses = [];
      if (q) {
        const base = (state.searchScope === 'tab' && state.activeTab !== 'Guides')
          ? OFFENSES.filter(o => o.category === state.activeTab)
          : OFFENSES;
        visibleOffenses = (state.searchScope === 'tab' && state.activeTab === 'Guides')
          ? []
          : base.filter(o => matchesQuery(o, q));
      } else if (state.activeTab !== 'Guides') {
        visibleOffenses = OFFENSES.filter(o => o.category === state.activeTab);
      }
      if (visibleOffenses.length === 0) return;

      const allExpanded = visibleOffenses.every(o => state.expandedIds.has(o.id));
      if (allExpanded) {
        visibleOffenses.forEach(o => state.expandedIds.delete(o.id));
      } else {
        visibleOffenses.forEach(o => state.expandedIds.add(o.id));
      }
      render();
    });

    // Offline PWA Manifest + Service Worker Setup (works automatically on GitHub Pages HTTPS)
    (function setupOfflinePWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0F172A"/><rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="#1D4ED8" stroke-width="16"/><text x="256" y="235" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-weight="800" font-size="112">CAC</text><text x="256" y="340" text-anchor="middle" fill="#93C5FD" font-family="system-ui,sans-serif" font-weight="700" font-size="68">T.C.A.</text></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
      document.getElementById('apple-icon').href = iconUrl;

      const manifest = {
        name: 'TN CAC Statutory Reference Guide',
        short_name: 'TN CAC Guide',
        description: 'Offline Tennessee CAC Statutory Reference & Quick Reference Guides',
        start_url: '.',
        display: 'standalone',
        background_color: '#F1F5F9',
        theme_color: '#0F172A',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/svg+xml' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        const swCode = `
          const CACHE_NAME = 'tn-cac-guide-v1';
          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll([self.location.href.split('#')[0]]))
            );
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((cached) => {
                const fetchPromise = fetch(e.request).then((resp) => {
                  if (resp && resp.status === 200) {
                    const copy = resp.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(e.request, copy));
                  }
                  return resp;
                }).catch(() => cached);
                return cached || fetchPromise;
              })
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    })();

    // Initial render
    render();
  </script>
</body>
</html>
